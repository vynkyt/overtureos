    <script>
      // Wait for the document to fully load before attaching event listeners
      window.onload = function () {
        let thumbnails = document.querySelectorAll(".video-thumbnail");
        let popUp = document.getElementById("pop-up");
        let iframe = document.getElementById("pop-up-iframe");
        let altCaption = document.getElementById("popCap");
        let container = document.querySelector("body");
        let buttons = document.querySelectorAll("#sidebar button");
        let i;

// adds a listener for when a button is clicked that adds the active class. yay
for (i = 0; i < buttons.length; i++) {
	buttons[i].addEventListener("click", function () {
		this.classList.add("active");
	});
}
   // Add click event listener to all video thumbnails
    thumbnails.forEach(function (thumbnail) {
      thumbnail.addEventListener("click", function () {
        const videoUrl = this.getAttribute('data-video');  // Get video URL from the data-video attribute
        const videoCaption = this.alt;  // Get the alt text for the video as the caption

        // Set the iframe src to the clicked video URL
        iframe.src = videoUrl;

        // Set the caption
        altCaption.innerText = videoCaption;

        // Check for corresponding caption div under the clicked image
        const captionDiv = document.getElementById(this.id + "-caption");
        if (captionDiv) {
          altCaption.innerHTML += captionDiv.innerHTML;  // Append the caption content
        }

        // Show the modal
        popUp.style.display = "block";
        container.style.overflow = "hidden"; // Disable background scrolling
      });
    });


 // Close the pop-up modal and stop the video playback
        window.closePopUp = function () {
          container.style.overflow = "auto";
          popUp.style.display = "none";
          iframe.src = "";  // Stop the video by clearing the iframe src
        }

        // Show categories based on clicked button
        window.showCat = function (className) {
          let classBox = document.getElementsByClassName(className);
          	for (i = 0; i < buttons.length; i++) {
		// removes any prior active button
		buttons[i].classList.remove("active");
	}
          for (let i = 0; i < classBox.length; i++) {
            classBox[i].style.display = "inline-block"; // Show videos with matching category class
          }

          // Hide all other categories
          let allBoxes = document.getElementsByClassName("box");
          for (let i = 0; i < allBoxes.length; i++) {
            if (!allBoxes[i].classList.contains(className)) {
              allBoxes[i].style.display = "none"; // Hide non-matching categories
            }
          }
        };
      }
    </script>
